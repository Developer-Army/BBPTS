name: Cross-Platform Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  linux-distros:
    name: Build & Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ 'fedora:latest', 'archlinux:latest' ]
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install dependencies (Fedora)
        if: matrix.distro == 'fedora:latest'
        run: |
          dnf install -y golang git make sqlite-devel gcc

      - name: Install dependencies (Arch Linux)
        if: matrix.distro == 'archlinux:latest'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm go git make sqlite gcc

      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Build
        run: make build-full

      - name: Run Tests
        run: make test

  bsd-systems:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ freebsd, openbsd ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Build and Test on FreeBSD VM
        if: matrix.os == 'freebsd'
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: freebsd
          version: '14.0'
          run: |
            sudo pkg install -y go bash git gmake sqlite3
            gmake build-full
            gmake test

      - name: Build and Test on OpenBSD VM
        if: matrix.os == 'openbsd'
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: openbsd
          version: '7.5'
          run: |
            sudo pkg_add go git gmake sqlite3
            gmake build-full
            gmake test
