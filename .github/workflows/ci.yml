name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          version: v1.60.1
          args: --timeout=5m

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@b0870985ee1c45f49df74c0c16999a0e60d282e7 # v1.0.3

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -fmt=json -out=gosec-report.json ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  gitleaks:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f553ab49692fc3b9a071536b328a6fcfd468b6ff # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: Supply Chain Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@ab5b6b3fd037dfb61dbec777c6dbaa20bb61f58a # v0.17.2

      - name: Generate SBOM
        run: syft . -o spdx-json=sbom.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@4f1cf2b489d816a7a0b81df98687a4192a6c8e3e # v3.8.0
        with:
          sbom: sbom.spdx.json
          fail-build: true

  test:
    name: Test and Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -v -race "-coverprofile=coverage-${{ matrix.os }}.out" -covermode=atomic ./...

      - name: Verify Coverage Threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func="coverage-${{ matrix.os }}.out" | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          INT_COVERAGE=$(echo "$COVERAGE" | cut -d. -f1)
          if [ -z "$INT_COVERAGE" ]; then
            echo "Failed to parse coverage"
            exit 1
          fi
          if [ "$INT_COVERAGE" -lt 65 ]; then
            echo "Error: Code coverage $INT_COVERAGE% is below threshold of 65%"
            exit 1
          fi

      - name: Verify Build
        run: go build -v ./...
