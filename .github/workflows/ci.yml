name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          version: v1.60.1
          args: --timeout=10m

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Lint job failed! Check golangci-lint output for details."

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@dd0578b371c987f96d1185abb54344b44352bd58 # v1.0.3

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -fmt=json -out=gosec-report.json ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Upload Gosec Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-report
          path: gosec-report.json

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Security scan job failed! Check govulncheck, gosec, or Trivy logs."

  gitleaks:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Gitleaks scan failed! Secrets detected in commit history."

  supply-chain:
    name: Supply Chain Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2

      - name: Generate SBOM
        run: syft . -o spdx-json=sbom.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a # v3.6.4
        with:
          sbom: sbom.spdx.json
          fail-build: true

      - name: Upload SBOM Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-report
          path: sbom.spdx.json

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Supply chain protection job failed! SBOM generation or Grype scan failed."

  test:
    name: Test and Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.23'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -v -race "-coverprofile=coverage-${{ matrix.os }}.out" -covermode=atomic ./...

      - name: Verify Coverage Threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func="coverage-${{ matrix.os }}.out" | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          INT_COVERAGE=$(echo "$COVERAGE" | cut -d. -f1)
          if [ -z "$INT_COVERAGE" ]; then
            echo "Failed to parse coverage"
            exit 1
          fi
          if [ "$INT_COVERAGE" -lt 38 ]; then
            echo "Error: Code coverage $INT_COVERAGE% is below threshold of 38%"
            exit 1
          fi

      - name: Verify Build
        run: go build -v ./...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Test and Build Verification job failed on ${{ matrix.os }}!"
